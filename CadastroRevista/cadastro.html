<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsivo.css">

</head>
<body>

    <div class="container">

        <div class="container-img">
            
            <img src="img/imgrevista.jpg">
        </div>

        <div class="container-cadastro">
            
            <h2 style="text-align: center;">THE EDITION</h2>
            <p style="text-align: center;">REVISTA DIGITAL · CULTURA · TECNOLOGIA · ESTILO</p><br><br>

            <form>

                <section>
  
            <input type="text" id="nometxt" name="nometxt" placeholder="Digite seu nome"><br><br><br>

            <input type="email" id="emailtxt" name="emailtxt" placeholder="Nome@dominio.com"><br><br><br>

            <input type="password" id="senha" name="senha" placeholder="Crie uma senha"><br><br><br>
            
            <input type="checkbox" id="termos" name="termos" value="termos">
            <label for="termos">Concordo com os termos de uso</label><br><br><br>

            <button type="submit" formaction="revista.html" formmethod="GET" id="criar" name="criar">Criar minha Conta</button><br><br><br>

            <h4 style="font-size: 12px;">TENHA ACESSO A NOVAS PERSPECTIVAS.</h4>
            <p style="font-size: 15px; width: 70%; text-align: center; margin: 11px auto;"><i>Assine nossa revista digital e receba acesso às nossas edições, conteúdos exclusivos e histórias selecionadas para você.</i></p>

                </section>
            </form>
        
        </div>
        
        
    </div>

</body>
</html>
